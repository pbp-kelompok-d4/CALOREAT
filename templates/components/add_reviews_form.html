<div id="reviewModal" class="modal-overlay" style="display: none;">
  <div class="modal-card">
    <div class="modal-header">
      <h3>Write a New Review</h3>
      <button type="button" class="modal-close-btn" id="closeModalBtn">&times;</button>
    </div>

    <form id="reviewForm" method="POST"
          data-add-url="{% url 'main:add_review_ajax' %}"
          data-edit-url-template="{% url 'main:edit_review' reviews_id='00000000-0000-0000-0000-000000000000' %}">
      {% csrf_token %}
      <div class="form-group">
        <label for="customer_name">Your Name</label>
        <input type="text" 
              id="customer_name" 
              name="customer_name" 
              value="{% if user.is_authenticated %}{{ user.first_name|default:'Admin' }}{% else %}Guest{% endif %}" 
              readonly 
              class="form-control-readonly">
      </div>

      <div class="form-group">
        <label id="starRatingLabel">Rating</label>
        <input type="hidden" id="star" name="star" value="★★★★★" required>
        <div class="star-rating-picker" id="starRatingPicker" role="radiogroup" aria-labelledby="starRatingLabel">
          <button type="button" class="star-rating-btn is-filled" data-rating="1" data-value="★☆☆☆☆" aria-label="1 star">★</button>
          <button type="button" class="star-rating-btn is-filled" data-rating="2" data-value="★★☆☆☆" aria-label="2 stars">★</button>
          <button type="button" class="star-rating-btn is-filled" data-rating="3" data-value="★★★☆☆" aria-label="3 stars">★</button>
          <button type="button" class="star-rating-btn is-filled" data-rating="4" data-value="★★★★☆" aria-label="4 stars">★</button>
          <button type="button" class="star-rating-btn is-filled" data-rating="5" data-value="★★★★★" aria-label="5 stars">★</button>
        </div>
      </div>

      <div class="form-group">
        <label for="content">Review</label>
        <textarea id="content" name="content" rows="3" maxlength="500" required placeholder="Write your review..."></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="cancelModalBtn">Cancel</button>
        <button type="submit" class="btn btn-yellow" id="submitBtn">Submit Review</button>
      </div>
    </form>
  </div>
</div>

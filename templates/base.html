{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (() => {
      try {
        if (localStorage.getItem("caloreat-theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
          document.documentElement.classList.add("dark");
        }
      } catch (_) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/output.css' %}?v=3">
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=nav-8">
  <link rel="stylesheet" href="{% static 'css/auth.css' %}">
  <link rel="stylesheet" href="{% static 'css/toast.css' %}">
  {% block extra_head %}{% endblock extra_head %}
  <link rel="stylesheet" href="{% static 'css/dark_theme.css' %}?v=7">
  <title>{% block title %}CALOREAT{% endblock %}</title>
</head>
<body>
    {% include "header.html" %}
    <main class="card">
        {% block content %} {% endblock content %}
    </main>
    {% include "footer.html" %}
<script src="{% static 'js/navbar.js' %}"></script>
</body>
</html>
